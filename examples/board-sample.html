<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>爨迹可视 · 城市视觉身份系统 — 展板样本</title>
<style>
  :root{
    --bg:#F5F4ED; --text:#141413; --accent:#c96442; --accent-ink:#8a3a22;
    --border:#C9C7BC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased;
  }
  .board{
    max-width:900px; margin:0 auto; padding:60px;
    position:relative;
  }
  header{border-bottom:1px solid var(--border); padding-bottom:24px; margin-bottom:32px;}
  h1{font-size:42px; line-height:1.1; margin:0 0 12px; font-weight:700; letter-spacing:-0.01em;}
  .subtitle{color:var(--accent-ink); font-size:16px; letter-spacing:0.18em; text-transform:uppercase; margin:0;}
  .grid{display:grid; grid-template-columns:2fr 1fr; gap:28px; margin-bottom:32px;}
  .hero{
    background:linear-gradient(135deg,#2b2a27,#5e5d59);
    height:360px; border:1px solid var(--border); border-radius:2px;
  }
  aside{border:1px solid var(--border); padding:20px; background:#efece3;}
  aside h3{margin:0 0 10px; font-size:14px; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent-ink);}
  aside p{font-size:14px; line-height:1.6; margin:0 0 12px;}
  figure{margin:0 0 32px;}
  .plate{height:220px; background:#d6d3d1; border:1px solid var(--border);}
  figcaption{font-size:13px; color:#5e5d59; margin-top:8px; letter-spacing:0.02em;}
  .body-cols{column-count:2; column-gap:28px; font-size:15px; line-height:1.7;}
  .body-cols p{margin:0 0 14px;}
  footer{border-top:1px solid var(--border); margin-top:32px; padding-top:16px;
    font-size:12px; letter-spacing:0.04em; color:#6b675e;}
</style>
</head>
<body>
  <div class="board">
    <header>
      <h1>爨迹可视<br>城市视觉身份系统</h1>
      <p class="subtitle">Cuan Script · Urban Identity</p>
    </header>

    <div class="grid">
      <div class="hero" role="img" aria-label="爨体字主视觉"></div>
      <aside>
        <h3>项目背景</h3>
        <p>曲靖爨宝子碑与爨龙颜碑，是中国书法史上「爨体」的双璧，承载滇东千年文脉。</p>
        <p>本系统将碑刻笔意转译为当代城市标识语言，建立五层视觉架构。</p>
      </aside>
    </div>

    <figure>
      <div class="plate" role="img" aria-label="笔画提取示意"></div>
      <figcaption>图 01 — 碑刻笔画的拓扑提取与网格映射</figcaption>
    </figure>

    <div class="body-cols">
      <p>爨体的方峻与圆融，在笔画交接处形成独特的「折钗股」质感。我们将其抽象为可缩放的几何母题。</p>
      <p>色彩取自碑石风化后的暖灰与朱砂钤印，构成克制而高贵的色谱体系。</p>
      <p>系统已在导视、文创、数字展陈三类场景完成落地验证，识别度显著优于通用字体方案。</p>
    </div>

    <footer>Generated by archviz-layout · 示例展板（still-paper 视觉语言）</footer>
  </div>
</body>
</html>
